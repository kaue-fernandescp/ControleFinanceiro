            </ul>

    <main class="container-categorias">
        <h1>Categorias</h1>
        <!-- Formulário Escondido !-->
            <div id="form-container" class="form-overlay" style="display: none;">
                <div class="form-content">
                    <h3 id="form-titulo">Nova Categoria</h3>
                    <form id="form-categoria" onsubmit="salvarNovaCategoria(event)">
                        <input type="hidden" id="form-cat-id">
                        <div class="form-group">
                            <label for="form-nome">Nome</label>
                            <input type="text" id="form-nome" required placeholder="Ex: Salário, Aluguel...">
                        </div>
                        <div class="form-botoes">
                            <button type="button" class="botao-cancelar" onclick="fecharForm()">Cancelar</button>
                            <button type="submit" class="botao-salvar">Salvar</button>   
                        </div>
                    </form>
                </div>
            </div>
        <!-- Fim Formulário Escondido !-->
        <div class="acoes">
            <button class="botao-adicionar" onclick="abrirForm()">Adicionar</button>
        </div>
        <div class="lista-categorias" id="container-lista">
            <!-- Código base
            <div class="linha-categoria">
                <span class="nome-categoria">${cat.cat_nome}</span>
                <div class="botoes-categoria">
                    <button class="botao-editar" onclick="editarCategoria(${cat.cat_id}, '${cat.cat_nome}')">Editar</button>
                    <button class="botao-excluir" onclick="excluirCategoria(${cat.cat_id})">Excluir</button>
                </div>
            </div>
            Código base !-->
        </div>
    </main>
