<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/historico.css">
    <link rel="stylesheet" href="../css/style.css">
    <title>Sistema de Controle Financeiro</title>
</head>
<body>
    <header>
        <nav>
            <ul class="nav-links">
                <li>Controle Financeiro</li>
                <li><a href="index.html">Dashboard</a></li>
                <li><a href="carteira.html">Carteira</a></li>
                <li><a href="recorrentes.html">Recorrentes</a></li>
                <li><a href="categorias.html">Categorias</a></li>
                <li><a href="historico.html">Histórico</a></li>
            </ul>
        </nav>
    </header>
    <main class="historico-container">
        <h1 class="titulo-centralizado">Histórico de Movimentações</h1>
        <section class="card-filtros">
            <div class="busca-grupo">
                <input type="text" id="filtro-busca" placeholder="Busca por descrição...">
            </div>
            <div class="busca-grupo">
                <select id="filtro-tipo">
                    <option value="todos">Todos os Tipos</option>
                    <option value="1">Apenas Entradas</option>
                    <option value="2">Apenas Saídas</option>
                    <option value="3">Apenas Entradas na Caixa</option>
                    <option value="4">Apenas Saídas da Caixa</option>
                </select>
            </div>
            <button id="botao-filtrar" class="botao-acao">Filtrar</button>
            <button id="botao-limpar" class="botao-limpar">Limpar</button>
        </section>
        <section class="card-tabela">
            <div class="tabela">
                <table>
                    <thead>
                        <tr>
                            <th>Data / Hora</th>
                            <th>Tipo</th>
                            <th>Descrição</th>
                            <th>Valor</th>
                        </tr>
                    </thead>
                    <tbody id="corpo-tabela">
                    </tbody>
                </table>
            </div>
        </section>
        <div class="paginacao-container">
            <button id="botao-anterior" disabled>Anterior</button>
            <span id="info-pagina">1</span>
            <button id="botao-proximo">Próximo</button>
        </div>
    </main>
    <footer>
        <div class="footer-content">
            <p>Sistema desenvolvido por <strong>Kauê Fernandes</strong>.</p>
            <ul class="social-links">
                <li><a href="https://www.instagram.com/kauefernandescp?igsh=MTRlaDFpdGxuaGZudg=="><img src="../assets/images/instagram.png" alt="Instagram"></a></li>
                <li><a href="https://www.linkedin.com/in/kauêfernandes?utm_source=share_via&utm_content=profile&utm_medium=member_android"><img src="../assets/images/linkedin.png" alt="LinkedIn"></a></li>
                <li><a href="https://github.com/kaue-fernandescp"><img src="../assets/images/github.png" alt="GitHub"></a></li>
            </ul>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/app.js"></script>
    <script src="../js/historico.js"></script>
</body>
</html>
