            </ul>
        </nav>

    <main>
        <h1>Recorrentes</h1>
        <!-- Formulário Escondido !--> 
        <div id="form-container" class="form-overlay" style="display: none;">
            <div class="form-content">
                <h3 id="form-titulo">Nova Entrada Recorrente</h3>
                <form id="form-recorrente" onsubmit="salvarNovoRecorrente(event)">
                    <input type="hidden" id="form-tipo-id">
                    <div class="form-group">
                        <label for="form-nome">Nome / Descrição</label>
                        <input type="text" id="form-nome" required placeholder="Ex: Internet, Academia...">
                    </div>
                    <div class="form-group">
                        <label for="form-valor">Valor (R$)</label>
                        <input type="number" id="form-valor" step="0.01" required placeholder="0.00">
                    </div>
                    <div class="form-group">
                        <label for="form-descricao">Detalhes (Opcional)</label>
                        <input type="text" id="form-descricao" required placeholder="Breve comentário...">
                    </div>
                    <div class="form-group">
                        <label for="form-categoria">Categoria</label>
                        <select id="form-categoria" required>
                            <option value="" disabled selected>Selecione uma categoria...</option>
                        </select>
                    </div>
                    <div class="form-botoes">
                        <button type="button" class="botao-cancelar" onclick="fecharForm()">Cancelar</button>
                        <button type="submit" class="botao-salvar">Salvar</button>
                    </div>
                </form>
            </div>
        </div> 
        <!-- Fim Formulário Escondido !-->
        <details class="container-entradas">
            <summary>Entradas Recorrentes</summary>
            <button class="botao-nova-entrada" onclick="abrirForm(1, 'Entrada')">Nova Entrada</button>
            <div class="conteudo" id="container-entradas-recorrentes">
            </div>  
        </details>
        <details class="container-saidas">
            <Summary>Saídas Recorrentes</Summary>
            <button class="botao-nova-saida" onclick="abrirForm(2, 'Saída')">Nova Saída</button>
            <div class="conteudo" id="container-saidas-recorrentes">
            </div> 
        </details> 
    </main>
